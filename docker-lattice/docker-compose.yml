version: "3.9"

services:
  gateway:
    build:
      context: ..
      dockerfile: docker-lattice/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
          condition: service_healthy
      redis:
          condition: service_healthy
    volumes:
      - ../alembic:/app/alembic
    environment:
      - PYTHONPATH=/app
    networks:
      default:
      shared-ai-net:
        aliases:
          - lattice-gateway

  ui:
    build:
      context: ..
      dockerfile: docker-lattice/ui.Dockerfile
    env_file:
      - ../.env   
    ports:
      - "5173:5173"
    depends_on:
      - gateway

  postgres:
    image: postgres:15
    env_file:
      - ../.env      
    ports:
      - "5432:5432"
    volumes:
      - lattice_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lattice"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 5s
      timeout: 5s

volumes:
  lattice_pgdata:

networks:
  shared-ai-net:
    external: true
